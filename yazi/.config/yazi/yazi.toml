[mgr]
show_hidden = false

[preview]
wrap = "yes"
image_delay = 0

[opener]
# open = [
#     { run = 'xdg-open "$@"', orphan = true, desc = "Open" },
# ]
images_preview = [
    { run = 'feh -Fq --start-at "%s" --on-last-slide hold .', desc = "Preview" },
]
pinta = [
    { run = 'pinta "%s"', desc = "Edit with Pinta" },
]

[open]
prepend_rules = [
    { mime = "image/*", use = [ "images_preview", "pinta" ] },
    { mime = "text/html", use = [ "open", "edit" ] },
]
